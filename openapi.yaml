openapi: 3.1.0
info:
  title: Chotu API
  version: 0.1.0
  description: "Chotu is an open-source, self-hostable vehicle fuel log. This is
    the M1 auth surface. Every error uses the shared Error schema: a stable
    `code`, a human `message`, and optional `details`."
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and applied schema version
      description: Unauthenticated. Reports that the API is up.
      security: []
      responses:
        "200":
          description: The service is up
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - schemaVersion
                properties:
                  status:
                    type: string
                    const: ok
                  schemaVersion:
                    type: integer
                    const: 1
  /auth/sign-in:
    post:
      operationId: signIn
      summary: Sign in with email and password
      description: Returns a session credential and sets an HttpOnly cookie. A wrong
        email or password returns the same generic 401. Rate limited per IP and
        per account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
              required:
                - email
                - password
              additionalProperties: false
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                  - session
                  - expiresAt
                properties:
                  user:
                    $ref: "#/components/schemas/PublicUser"
                  session:
                    type: string
                    description: Session credential
                  expiresAt:
                    type: string
                    format: date-time
        "400":
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Wrong email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited; see Retry-After
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/sign-out:
    post:
      operationId: signOut
      summary: Revoke the current session
      description: Requires authentication. Clears the session cookie.
      responses:
        "204":
          description: Signed out
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/change-password:
    post:
      operationId: changePassword
      summary: Change the password by supplying the current one
      description: Requires authentication (a session or an API token). Clears the
        must-change-password flag on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                  minLength: 1
                newPassword:
                  type: string
                  minLength: 8
              required:
                - currentPassword
                - newPassword
              additionalProperties: false
      responses:
        "204":
          description: Password changed
        "400":
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Current password is wrong or not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/me:
    get:
      operationId: getMe
      summary: The signed-in user
      description: Requires authentication. A must-change-password user is refused
        with 403 until the password is changed.
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/PublicUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Password change required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /vehicles:
    get:
      operationId: listVehicles
      summary: List the caller's vehicles
      description: Requires authentication. Archived vehicles are hidden unless
        ?includeArchived=true (FR-11.4).
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The caller's vehicles
          content:
            application/json:
              schema:
                type: object
                required:
                  - vehicles
                properties:
                  vehicles:
                    type: array
                    items:
                      $ref: "#/components/schemas/Vehicle"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createVehicle
      summary: Create a vehicle
      description: Requires authentication (FR-11.1). `initialOdometer` is in the
        caller's own unit system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                make:
                  type: string
                  minLength: 1
                  maxLength: 100
                  nullable: true
                model:
                  type: string
                  minLength: 1
                  maxLength: 100
                  nullable: true
                year:
                  type: integer
                  minimum: 1900
                  maximum: 2100
                  nullable: true
                fuelType:
                  type: string
                  enum:
                    - gasoline
                    - diesel
                    - ev
                    - hybrid
                    - other
                  nullable: true
                initialOdometer:
                  type: number
                  minimum: 0
              required:
                - name
                - initialOdometer
              additionalProperties: false
      responses:
        "201":
          description: The new vehicle
          content:
            application/json:
              schema:
                type: object
                required:
                  - vehicle
                properties:
                  vehicle:
                    $ref: "#/components/schemas/Vehicle"
        "400":
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A vehicle with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /vehicles/{id}:
    get:
      operationId: getVehicle
      summary: Get one vehicle
      description: Requires authentication. A vehicle the caller does not own is 404,
        never 403 (FR-11.6).
      parameters:
        - &a1
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The vehicle
          content:
            application/json:
              schema:
                type: object
                required:
                  - vehicle
                properties:
                  vehicle:
                    $ref: "#/components/schemas/Vehicle"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such vehicle for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateVehicle
      summary: Update a vehicle's editable fields
      description: Requires authentication (FR-11.3). The starting odometer is fixed
        at creation and cannot be changed here.
      parameters:
        - *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                make:
                  type: string
                  minLength: 1
                  maxLength: 100
                  nullable: true
                model:
                  type: string
                  minLength: 1
                  maxLength: 100
                  nullable: true
                year:
                  type: integer
                  minimum: 1900
                  maximum: 2100
                  nullable: true
                fuelType:
                  type: string
                  enum:
                    - gasoline
                    - diesel
                    - ev
                    - hybrid
                    - other
                  nullable: true
              additionalProperties: false
      responses:
        "200":
          description: The updated vehicle
          content:
            application/json:
              schema:
                type: object
                required:
                  - vehicle
                properties:
                  vehicle:
                    $ref: "#/components/schemas/Vehicle"
        "400":
          description: Malformed body or no field to change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such vehicle for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A vehicle with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteVehicle
      summary: Delete a vehicle
      description: Requires authentication (FR-11.5). A `cascade` flag is reserved for
        when a vehicle has fuel entries (slice 9); today a vehicle can never
        have any, so delete always succeeds.
      parameters:
        - *a1
      responses:
        "204":
          description: Deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such vehicle for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /vehicles/{id}/archive:
    post:
      operationId: archiveVehicle
      summary: Archive a vehicle
      description: Requires authentication (FR-11.4). Idempotent. An archived vehicle
        is hidden from the default list and rejects new fuel entries; its
        history stays readable.
      parameters:
        - *a1
      responses:
        "200":
          description: The archived vehicle
          content:
            application/json:
              schema:
                type: object
                required:
                  - vehicle
                properties:
                  vehicle:
                    $ref: "#/components/schemas/Vehicle"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such vehicle for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /vehicles/{id}/unarchive:
    post:
      operationId: unarchiveVehicle
      summary: Unarchive a vehicle
      description: Requires authentication (FR-11.4). Idempotent.
      parameters:
        - *a1
      responses:
        "200":
          description: The unarchived vehicle
          content:
            application/json:
              schema:
                type: object
                required:
                  - vehicle
                properties:
                  vehicle:
                    $ref: "#/components/schemas/Vehicle"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such vehicle for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /profile:
    get:
      operationId: getProfile
      summary: The caller's own profile
      description: Requires authentication. Returns display name, unit system, IANA
        time zone, and the read-only USD currency code.
      responses:
        "200":
          description: The caller's profile
          content:
            application/json:
              schema:
                type: object
                required:
                  - profile
                properties:
                  profile:
                    $ref: "#/components/schemas/Profile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Password change required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateProfile
      summary: Update the caller's own profile
      description: Requires authentication. Any subset of display name, unit system,
        and time zone. `currency_code` is read-only USD in M1. A unit-system
        change does not rewrite stored data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 100
                unitSystem:
                  type: string
                  enum:
                    - imperial
                    - metric
                timeZone:
                  type: string
                  minLength: 1
              additionalProperties: false
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema:
                type: object
                required:
                  - profile
                properties:
                  profile:
                    $ref: "#/components/schemas/Profile"
        "400":
          description: Malformed body or no field to change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Password change required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteOwnAccount
      summary: Delete the caller's own account
      description: Requires authentication. Removes the caller's vehicles, fuel
        entries, tokens, sessions, and identities. Recorded in the audit log
        without personal content. The last active admin cannot delete their own
        account.
      responses:
        "204":
          description: Account deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Password change required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: This is the last active admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tokens:
    get:
      operationId: listApiTokens
      summary: List the caller's API tokens
      description: Requires authentication. Never returns the token value.
      responses:
        "200":
          description: The caller's tokens
          content:
            application/json:
              schema:
                type: object
                required:
                  - tokens
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiToken"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createApiToken
      summary: Create an API token
      description: Requires authentication. The plaintext token is returned once and
        then only stored hashed.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  maxLength: 100
              additionalProperties: false
      responses:
        "201":
          description: The new token, shown once
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                  - note
                properties:
                  token:
                    type: string
                  note:
                    type: string
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tokens/{id}:
    delete:
      operationId: revokeApiToken
      summary: Revoke one of the caller's API tokens
      description: Requires authentication. A token the caller does not own is 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked (or already revoked)
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such token for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /register:
    post:
      operationId: register
      summary: Self-register an account
      description: Unauthenticated. Active only while the deployment's
        registration_policy is `open` (FR-3.5). The account cannot sign in until
        it verifies its email with POST /verify. The verify link is returned in
        the response when email is not configured (R-2 interim).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 100
                password:
                  type: string
                  minLength: 8
              required:
                - email
                - displayName
                - password
              additionalProperties: false
      responses:
        "201":
          description: The new, unverified account
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/PublicUser"
                  verifyToken:
                    type: string
                    description: Present when email is not configured
                  note:
                    type: string
        "400":
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Self-registration is not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited; see Retry-After
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /verify:
    post:
      operationId: verifyEmail
      summary: Consume a verification link
      description: Unauthenticated. Sets `emailVerifiedAt` so the account can sign in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 1
              required:
                - token
              additionalProperties: false
      responses:
        "200":
          description: The now-verified account
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/PublicUser"
        "400":
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Invalid, expired, or already-used link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited; see Retry-After
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/oidc/{key}/start:
    get:
      operationId: oidcStart
      summary: Begin an OIDC sign-in
      description: Unauthenticated. Redirects (302) to the provider's authorization
        endpoint (FR-6.2).
      security: []
      parameters:
        - &a2
          name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the provider
        "404":
          description: No such provider, or it is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/oidc/{key}/link/start:
    get:
      operationId: oidcLinkStart
      summary: Begin linking a new identity to the caller's account
      description: Requires authentication (T7.4). Redirects (302) to the provider's
        authorization endpoint.
      parameters:
        - *a2
      responses:
        "302":
          description: Redirect to the provider
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such provider, or it is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/oidc/{key}/callback:
    get:
      operationId: oidcCallback
      summary: Complete an OIDC sign-in or link
      description: Unauthenticated (the provider redirects the browser here with no
        Chotu credential). Signs in on a returning identity, auto-provisions a
        new account when the provider and the deployment's registration_policy
        both allow it, or links the identity to the user who started a
        /link/start attempt. An expired, unknown, or already-consumed attempt,
        an out-of-domain or out-of-group identity (AC-11), or a provider
        mismatch all fail without creating anything.
      security: []
      parameters:
        - *a2
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Signed in (or a /link/start attempt completed)
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - user
                      - session
                      - expiresAt
                    properties:
                      user:
                        $ref: "#/components/schemas/PublicUser"
                      session:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
                  - type: object
                    required:
                      - linked
                      - providerKey
                    properties:
                      linked:
                        type: boolean
                        const: true
                      providerKey:
                        type: string
        "201":
          description: Auto-provisioned and signed in
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                  - session
                  - expiresAt
                properties:
                  user:
                    $ref: "#/components/schemas/PublicUser"
                  session:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        "401":
          description: Invalid, expired, or already-used attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Disabled provider, out-of-domain/group identity, or no email claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such provider or user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already linked to a different user, or email taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /identities:
    get:
      operationId: listIdentities
      summary: List the caller's linked OIDC identities
      description: Requires authentication (T7.4).
      responses:
        "200":
          description: The caller's linked identities
          content:
            application/json:
              schema:
                type: object
                required:
                  - identities
                properties:
                  identities:
                    type: array
                    items:
                      $ref: "#/components/schemas/Identity"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /identities/{id}:
    delete:
      operationId: unlinkIdentity
      summary: Unlink one of the caller's OIDC identities
      description: Requires authentication (FR-6.3). Refused if this is the caller's
        only sign-in method.
      parameters:
        - *a1
      responses:
        "204":
          description: Unlinked
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such identity for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: This is the caller's only sign-in method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/oidc-providers:
    get:
      operationId: adminListOidcProviders
      summary: List OIDC providers
      description: Admin only (FR-9.3). The client secret reference is never returned;
        `secretConfigured` is always true.
      responses:
        "200":
          description: Every configured provider
          content:
            application/json:
              schema:
                type: object
                required:
                  - providers
                properties:
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/OidcProvider"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: adminCreateOidcProvider
      summary: Add an OIDC provider
      description: Admin only (FR-6.1). `clientSecretRef` is an environment reference,
        for example "env:MY_PROVIDER_SECRET" — the operator sets that variable
        on the host; Chotu never stores the raw secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  pattern: ^[a-z0-9-]{1,40}$
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 100
                issuerUrl:
                  type: string
                  format: uri
                clientId:
                  type: string
                  minLength: 1
                  maxLength: 200
                clientSecretRef:
                  type: string
                  pattern: ^env:[A-Za-z_][A-Za-z0-9_]*$
                scopes:
                  type: array
                  items:
                    type: string
                    minLength: 1
                  minItems: 1
                  default: &a3
                    - openid
                    - email
                    - profile
                allowedEmailDomains:
                  type: array
                  items:
                    type: string
                    minLength: 1
                  nullable: true
                  default: null
                allowedGroups:
                  type: array
                  items:
                    type: string
                    minLength: 1
                  nullable: true
                  default: null
                autoProvision:
                  type: boolean
                  default: false
                enabled:
                  type: boolean
                  default: true
              required:
                - key
                - displayName
                - issuerUrl
                - clientId
                - clientSecretRef
              additionalProperties: false
      responses:
        "201":
          description: The new provider
          content:
            application/json:
              schema:
                type: object
                required:
                  - provider
                properties:
                  provider:
                    $ref: "#/components/schemas/OidcProvider"
        "400":
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: That provider key is already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/oidc-providers/{key}:
    get:
      operationId: adminGetOidcProvider
      summary: Read one OIDC provider
      description: Admin only (FR-9.3).
      parameters:
        - *a2
      responses:
        "200":
          description: The provider
          content:
            application/json:
              schema:
                type: object
                required:
                  - provider
                properties:
                  provider:
                    $ref: "#/components/schemas/OidcProvider"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: adminUpdateOidcProvider
      summary: Update an OIDC provider
      description: Admin only (FR-9.3). `key` cannot be changed.
      parameters:
        - *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 100
                issuerUrl:
                  type: string
                  format: uri
                clientId:
                  type: string
                  minLength: 1
                  maxLength: 200
                clientSecretRef:
                  type: string
                  pattern: ^env:[A-Za-z_][A-Za-z0-9_]*$
                scopes:
                  type: array
                  items:
                    type: string
                    minLength: 1
                  minItems: 1
                  default: *a3
                allowedEmailDomains:
                  type: array
                  items:
                    type: string
                    minLength: 1
                  nullable: true
                  default: null
                allowedGroups:
                  type: array
                  items:
                    type: string
                    minLength: 1
                  nullable: true
                  default: null
                autoProvision:
                  type: boolean
                  default: false
                enabled:
                  type: boolean
                  default: true
              additionalProperties: false
      responses:
        "200":
          description: The updated provider
          content:
            application/json:
              schema:
                type: object
                required:
                  - provider
                properties:
                  provider:
                    $ref: "#/components/schemas/OidcProvider"
        "400":
          description: Malformed body or no field to change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: adminDeleteOidcProvider
      summary: Delete an OIDC provider
      description: Admin only. Refused with `provider_in_use` while any identity is
        linked to this provider, unless `?force=true`, which unlinks every
        affected identity first and refuses the whole delete
        (`auth_method_required`) if that would leave any user with no sign-in
        method.
      parameters:
        - *a2
        - name: force
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: Deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Linked identities exist; retry with force
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Force-deleting would leave a user with no sign-in method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/invitations:
    post:
      operationId: adminCreateInvitation
      summary: Create a single-use invitation
      description: Admin only (FR-3.2). The plaintext invitation token is returned
        once and then only stored hashed. Default expiry is 7 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                invitedRole:
                  type: string
                  enum:
                    - user
                    - admin
                  default: user
                expiresInSeconds:
                  type: integer
                  minimum: 1
                  maximum: 2592000
              required:
                - email
              additionalProperties: false
      responses:
        "201":
          description: The invitation
          content:
            application/json:
              schema:
                type: object
                required:
                  - invitation
                  - invitationToken
                  - note
                properties:
                  invitation:
                    type: object
                    required:
                      - id
                      - email
                      - invitedRole
                      - expiresAt
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                        format: email
                      invitedRole:
                        type: string
                        enum:
                          - user
                          - admin
                      expiresAt:
                        type: string
                        format: date-time
                  invitationToken:
                    type: string
                  note:
                    type: string
        "400":
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation and create the account
      description: Unauthenticated. `token` is the plaintext invitation link. An
        expired, unknown, or already-used invitation returns the same
        `invitation_consumed` code (FR-3.3, FR-3.4).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 1
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 100
                password:
                  type: string
                  minLength: 8
              required:
                - token
                - displayName
                - password
              additionalProperties: false
      responses:
        "201":
          description: The new account
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/PublicUser"
        "400":
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Expired, unknown, or already-used invitation; or email already
            registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/settings:
