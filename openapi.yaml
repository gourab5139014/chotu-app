openapi: 3.1.0
info:
  title: Chotu API
  version: 0.1.0
  description: "Chotu is an open-source, self-hostable vehicle fuel log. This is
    the M1 auth surface. Every error uses the shared Error schema: a stable
    `code`, a human `message`, and optional `details`."
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and applied schema version
      description: Unauthenticated. Reports that the API is up.
      security: []
      responses:
        "200":
          description: The service is up
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - schemaVersion
                properties:
                  status:
                    type: string
                    const: ok
                  schemaVersion:
                    type: integer
                    const: 1
  /auth/sign-in:
    post:
      operationId: signIn
      summary: Sign in with email and password
      description: Returns a session credential and sets an HttpOnly cookie. A wrong
        email or password returns the same generic 401. Rate limited per IP and
        per account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
              required:
                - email
                - password
              additionalProperties: false
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                  - session
                  - expiresAt
                properties:
                  user:
                    $ref: "#/components/schemas/PublicUser"
                  session:
                    type: string
                    description: Session credential
                  expiresAt:
                    type: string
                    format: date-time
        "400":
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Wrong email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited; see Retry-After
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/sign-out:
    post:
      operationId: signOut
      summary: Revoke the current session
      description: Requires authentication. Clears the session cookie.
      responses:
        "204":
          description: Signed out
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/change-password:
    post:
      operationId: changePassword
      summary: Change the password by supplying the current one
      description: Requires authentication (a session or an API token). Clears the
        must-change-password flag on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                  minLength: 1
                newPassword:
                  type: string
                  minLength: 8
              required:
                - currentPassword
                - newPassword
              additionalProperties: false
      responses:
        "204":
          description: Password changed
        "400":
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Current password is wrong or not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/me:
    get:
      operationId: getMe
      summary: The signed-in user
      description: Requires authentication. A must-change-password user is refused
        with 403 until the password is changed.
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/PublicUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Password change required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /profile:
    get:
      operationId: getProfile
      summary: The caller's own profile
      description: Requires authentication. Returns display name, unit system, IANA
        time zone, and the read-only USD currency code.
      responses:
        "200":
          description: The caller's profile
          content:
            application/json:
              schema:
                type: object
                required:
                  - profile
                properties:
                  profile:
                    $ref: "#/components/schemas/Profile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Password change required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateProfile
      summary: Update the caller's own profile
      description: Requires authentication. Any subset of display name, unit system,
        and time zone. `currency_code` is read-only USD in M1. A unit-system
        change does not rewrite stored data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 100
                unitSystem:
                  type: string
                  enum:
                    - imperial
                    - metric
                timeZone:
                  type: string
                  minLength: 1
              additionalProperties: false
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema:
                type: object
                required:
                  - profile
                properties:
                  profile:
                    $ref: "#/components/schemas/Profile"
        "400":
          description: Malformed body or no field to change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Password change required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteOwnAccount
      summary: Delete the caller's own account
      description: Requires authentication. Removes the caller's vehicles, fuel
        entries, tokens, sessions, and identities. Recorded in the audit log
        without personal content. The last active admin cannot delete their own
        account.
      responses:
        "204":
          description: Account deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Password change required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: This is the last active admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tokens:
    get:
      operationId: listApiTokens
      summary: List the caller's API tokens
      description: Requires authentication. Never returns the token value.
      responses:
        "200":
          description: The caller's tokens
          content:
            application/json:
              schema:
                type: object
                required:
                  - tokens
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiToken"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createApiToken
      summary: Create an API token
      description: Requires authentication. The plaintext token is returned once and
        then only stored hashed.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  maxLength: 100
              additionalProperties: false
      responses:
        "201":
          description: The new token, shown once
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                  - note
                properties:
                  token:
                    type: string
                  note:
                    type: string
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tokens/{id}:
    delete:
      operationId: revokeApiToken
      summary: Revoke one of the caller's API tokens
      description: Requires authentication. A token the caller does not own is 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked (or already revoked)
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such token for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/invitations:
    post:
      operationId: adminCreateInvitation
      summary: Create a single-use invitation
      description: Admin only (FR-3.2). The plaintext invitation token is returned
        once and then only stored hashed. Default expiry is 7 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                invitedRole:
                  type: string
                  enum:
                    - user
                    - admin
                  default: user
                expiresInSeconds:
                  type: integer
                  minimum: 1
                  maximum: 2592000
              required:
                - email
              additionalProperties: false
      responses:
        "201":
          description: The invitation
          content:
            application/json:
              schema:
                type: object
                required:
                  - invitation
                  - invitationToken
                  - note
                properties:
                  invitation:
                    type: object
                    required:
                      - id
                      - email
                      - invitedRole
                      - expiresAt
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                        format: email
                      invitedRole:
                        type: string
                        enum:
                          - user
                          - admin
                      expiresAt:
                        type: string
                        format: date-time
                  invitationToken:
                    type: string
                  note:
                    type: string
        "400":
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation and create the account
      description: Unauthenticated. `token` is the plaintext invitation link. An
        expired, unknown, or already-used invitation returns the same
        `invitation_consumed` code (FR-3.3, FR-3.4).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 1
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 100
                password:
                  type: string
                  minLength: 8
              required:
                - token
                - displayName
                - password
              additionalProperties: false
      responses:
        "201":
          description: The new account
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/PublicUser"
        "400":
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Expired, unknown, or already-used invitation; or email already
            registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users:
    get:
      operationId: adminListUsers
      summary: List every account
      description: Admin only. Accounts, roles, status, and a vehicle count. No fuel
        entry data is ever included (INV-9).
      responses:
        "200":
          description: Every account, newest first
          content:
            application/json:
              schema:
                type: object
                required:
                  - users
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminUserListItem"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: adminCreateUser
      summary: Create an account directly
      description: Admin only (FR-8.3). Omit `password` to get a one-time set-password
        link in the response instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 100
                role:
                  type: string
                  enum:
                    - user
                    - admin
                  default: user
                password:
                  type: string
                  minLength: 8
              required:
                - email
                - displayName
              additionalProperties: false
      responses:
        "201":
          description: The new account
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/AdminUserListItem"
                  setPasswordToken:
                    type: string
                    description: Present when no password was supplied
                  note:
                    type: string
        "400":
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users/{id}:
    get:
      operationId: adminGetUser
      summary: One account with security metadata
      description: Admin only. Adds last sign-in, linked identities, and the active
        API-token count. No fuel entry data is ever included (INV-9).
      parameters:
        - &a1
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/AdminUserDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: adminDeleteUser
      summary: Delete an account and all its data
      description: Admin only (FR-8.6). `confirmEmail` must equal the target's email.
        Cascades vehicles, entries, tokens, sessions, identities. Refused for
        the last active admin (INV-6).
      parameters:
        - *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmEmail:
                  type: string
                  format: email
              required:
                - confirmEmail
              additionalProperties: false
      responses:
        "204":
          description: Deleted
        "400":
          description: Missing or mismatched confirmEmail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: This is the last active admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users/{id}/deactivate:
    post:
      operationId: adminDeactivateUser
      summary: Deactivate an account
      description: Admin only (FR-8.4). Cuts the user's sessions and API tokens
        immediately. Refused for the last active admin (INV-6).
      parameters:
        - *a1
      responses:
        "204":
          description: Done (idempotent)
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: This is the last active admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users/{id}/reactivate:
    post:
      operationId: adminReactivateUser
      summary: Reactivate an account
      description: Admin only (FR-8.4).
      parameters:
        - *a1
      responses:
        "204":
          description: Done (idempotent)
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: This is the last active admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users/{id}/grant-admin:
    post:
      operationId: adminGrantAdmin
      summary: Grant the admin role
      description: Admin only (FR-8.7).
      parameters:
        - *a1
      responses:
        "204":
          description: Done (idempotent)
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: This is the last active admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users/{id}/revoke-admin:
    post:
      operationId: adminRevokeAdmin
      summary: Revoke the admin role
      description: Admin only (FR-8.7). Refused for the last active admin (INV-6).
      parameters:
        - *a1
      responses:
        "204":
          description: Done (idempotent)
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: This is the last active admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users/{id}/reset:
    post:
      operationId: adminTriggerReset
      summary: Trigger a password reset for an account
      description: Admin only (FR-8.5). Issues a reset link. The link is returned in
        the response when email is not configured (R-2 interim).
      parameters:
        - *a1
      responses:
        "200":
          description: Reset issued
          content:
            application/json:
              schema:
                type: object
                required:
                  - sent
                properties:
                  sent:
                    type: boolean
                  resetToken:
                    type: string
                    description: Present when email is not configured
                  note:
                    type: string
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /openapi.yaml:
    get:
      operationId: getOpenApi
      summary: This document
      description: Unauthenticated.
      security: []
      responses:
        "200":
          description: The OpenAPI document, as YAML
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: chotu_session
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - validation_error
            - unauthorized
            - forbidden
            - password_change_required
            - not_found
            - email_taken
            - invitation_consumed
            - conflict
            - odometer_decrease
            - last_admin
            - auth_method_required
            - rate_limited
            - internal_error
        message:
          type: string
        details:
          description: Optional structured detail
    PublicUser:
      type: object
      required:
        - id
        - email
        - displayName
        - role
        - mustChangePassword
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum:
            - user
            - admin
        mustChangePassword:
          type: boolean
    Profile:
      type: object
      required:
        - id
        - email
        - displayName
        - role
        - unitSystem
        - timeZone
        - currencyCode
        - mustChangePassword
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum:
            - user
            - admin
        unitSystem:
          type: string
          enum:
            - imperial
            - metric
        timeZone:
          type: string
          description: IANA time zone
        currencyCode:
          type: string
          const: USD
          description: Read-only in M1
        mustChangePassword:
          type: boolean
    AdminUserListItem:
      type: object
      required:
        - id
        - email
        - displayName
        - role
        - status
        - createdAt
        - vehicleCount
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum:
            - user
            - admin
        status:
          type: string
          enum:
            - active
            - deactivated
        createdAt:
          type: string
          format: date-time
        vehicleCount:
          type: integer
          minimum: 0
    AdminUserDetail:
      allOf:
        - $ref: "#/components/schemas/AdminUserListItem"
        - type: object
          required:
            - lastSignInAt
            - linkedIdentities
            - activeTokenCount
          properties:
            lastSignInAt:
              type:
                - string
                - "null"
              format: date-time
            linkedIdentities:
              type: array
              items:
                type: string
            activeTokenCount:
              type: integer
              minimum: 0
    ApiToken:
      type: object
      required:
        - id
        - label
        - createdAt
        - lastUsedAt
        - expiresAt
        - revokedAt
      properties:
        id:
          type: string
        label:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type:
            - string
            - "null"
          format: date-time
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
        revokedAt:
          type:
            - string
            - "null"
          format: date-time
security:
  - bearerAuth: []
  - cookieAuth: []
