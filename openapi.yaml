  /openapi.yaml:
    get:
      operationId: getOpenApi
      summary: This document
      description: Unauthenticated.
      security: []
      responses:
        "200":
          description: The OpenAPI document, as YAML
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: chotu_session
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - validation_error
            - unauthorized
            - forbidden
            - password_change_required
            - not_found
            - email_taken
            - invitation_consumed
            - conflict
            - odometer_decrease
            - last_admin
            - auth_method_required
            - provider_in_use
            - rate_limited
            - internal_error
        message:
          type: string
        details:
          description: Optional structured detail
    PublicUser:
      type: object
      required:
        - id
        - email
        - displayName
        - role
        - mustChangePassword
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum:
            - user
            - admin
        mustChangePassword:
          type: boolean
    Profile:
      type: object
      required:
        - id
        - email
        - displayName
        - role
        - unitSystem
        - timeZone
        - currencyCode
        - mustChangePassword
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum:
            - user
            - admin
        unitSystem:
          type: string
          enum:
            - imperial
            - metric
        timeZone:
          type: string
          description: IANA time zone
        currencyCode:
          type: string
          const: USD
          description: Read-only in M1
        mustChangePassword:
          type: boolean
    DeploymentSettings:
      type: object
      required:
        - deploymentName
        - registrationPolicy
        - allowedAuthMethods
        - defaultUnitSystem
        - defaultCurrencyCode
        - defaultTimeZone
        - fuelVolumePrecision
        - sessionTtlSeconds
        - apiTokenTtlSeconds
      properties:
        deploymentName:
          type: string
        registrationPolicy:
          type: string
          enum:
            - invite_only
            - open
            - sso_auto
        allowedAuthMethods:
          type: array
          items:
            type: string
            enum:
              - password
              - oidc
        defaultUnitSystem:
          type: string
          enum:
            - imperial
            - metric
        defaultCurrencyCode:
          type: string
          const: USD
          description: Read-only in M1
        defaultTimeZone:
          type: string
          description: IANA time zone
        fuelVolumePrecision:
          type: integer
          minimum: 1
          maximum: 3
        sessionTtlSeconds:
          type: integer
          minimum: 60
        apiTokenTtlSeconds:
          type:
            - integer
            - "null"
          minimum: 60
    Vehicle:
      type: object
      required:
        - id
        - name
        - make
        - model
        - year
        - fuelType
        - initialOdometerMiE3
        - initialOdometer
        - unitSystem
        - archivedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        make:
          type:
            - string
            - "null"
        model:
          type:
            - string
            - "null"
        year:
          type:
            - integer
            - "null"
        fuelType:
          type:
            - string
            - "null"
          enum:
            - gasoline
            - diesel
            - ev
            - hybrid
            - other
            - null
        initialOdometerMiE3:
          type: integer
          description: "Canonical: thousandths of a mile (D-1)"
        initialOdometer:
          type: number
          description: Display projection in unitSystem (FR-15.3)
        unitSystem:
          type: string
          enum:
            - imperial
            - metric
        archivedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Identity:
      type: object
      required:
        - id
        - providerKey
        - subject
        - createdAt
        - lastLoginAt
      properties:
        id:
          type: string
        providerKey:
          type: string
        subject:
          type: string
        createdAt:
